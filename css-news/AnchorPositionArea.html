<!DOCTYPE HTML>
<html lang="en">


<head>
    <title>Anchor Position Area</title>
    <style>
        :root {
        }
        .element {
            width : 20cqi;
            aspect-ratio: 1/1;
        }
        .anchor {
            anchor-name:  --anchor-0;
            anchor-scope: --anchor-0;
            background-color: hsl( calc(sibling-index()*30deg) 100% 50% );
        }
        .positioned {
            position: fixed;
            position-anchor: --anchor-0;
            position-area: bottom right;
            height: calc(anchor-size() * .3) ;

            background-color: inherit;
        }

    </style>
</head>

<body>
<pre>
Anchor positioning consider
- anchor element with unique id and unique anchor name
- nesting positioned element below anchor and disambiguate with anchor-scope
</pre>

<div class="element anchor">
    <div class="element positioned"></div>
</div>
<div class="element anchor">
    <div class="element positioned"></div>
</div>
<div class="element anchor">
    <div class="element positioned"></div>
</div>

</body>

</html>
