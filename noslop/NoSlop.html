<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoSlop</title>
</head>
<style>

body {
    /*background-color: blanchedalmond;*/
}
    .position {
        width: 62vmin;
        margin-inline: auto;
    }
    .noslop {
        container: noslop inline-size;
        aspect-ratio: 1 / 1;
        background-image: url("./noSlopOuter.png");
        background-repeat: no-repeat;
        background-size: contain;
        overflow: clip;
        --stamp-time: 1s;
        transition: all var(--stamp-time);
        transition-timing-function: cubic-bezier(0, 0, 0.7, 0.5);
        @starting-style {
            opacity: 0;
            scale: 1.5;
        }

        position: relative;
        &::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("./noSlopInner.png");
            background-repeat: no-repeat;
            background-size: contain;

            transition: transform 1s var(--stamp-time) linear;
            @starting-style {
                transform: rotate(45deg) translateX(100%) translateY(100%);
            }
        }
    }

</style>
<body>
<h1>Create No Slop</h1>
<div class="position noslop"></div>

</body>
</html>
